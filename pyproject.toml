[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intake-to-structured-data"
version = "0.1.1"
description = "Traceable transcription of real scanned public reports with three CPU OCR pipelines"
requires-python = ">=3.12,<3.13"
dependencies = ["pypdfium2==4.30.0", "Pillow==10.4.0", "pywin32==312; sys_platform == 'win32'", "psutil==7.2.2; sys_platform == 'win32'"]

[project.optional-dependencies]
tesseract = ["pytesseract==0.3.13"]
rapidocr = ["rapidocr==3.4.2", "onnxruntime==1.23.2"]
docling = ["docling==2.67.0", "rapidocr==3.4.2", "onnxruntime==1.23.2"]
test = ["pytest==8.4.2", "pypdf==6.1.1", "psutil==7.2.2", "rapidocr==3.4.2", "onnxruntime==1.23.2"]

[project.scripts]
scan-intake = "scan_intake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
